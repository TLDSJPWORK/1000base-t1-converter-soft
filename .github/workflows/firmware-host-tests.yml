name: Firmware host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S .
          -B build-host
          -DCONVERTER_HOST_TESTS=ON

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: >-
          ctest --test-dir build-host
          --output-on-failure
